<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>BMI</title>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-8">
    <div class="bg-white rounded-lg w-80 shadow overflow-hidden">
        <header class="bg-blue-400">
        <h2 class="text-2xl text-gray-800 font-bold p-4">BMI計算ツール</h2>
        </header>
        <main class="p-4">
            <label class="text-lg text-gray-600">身長（cm）</label>
            <input id="height" type="number" placeholder="例：170" class="block w-full border border-gray-300 rounded mb-4">
            <label class="text-lg text-gray-600">体重（㎏）</label>
            <input id="weight" type="number" placeholder="例：65" class="w-full border border-gray-300 rounded block mb-8">
            <button id="button" class="p-2 w-full bg-blue-400 rounded text-xl font-bold text-white">計算する</button>
            <div class="rounded border border-gray-300 mt-8 p-4">
                <p class="text-xs text-gray-600 text-center pb-2">診断結果</p>
                <p id="result" class="text-xl text-center text-blue-800 font-bold">瘦せ型/普通/肥満</p>
            </div>
        </main>
    </div>
    
    <script>
        function calcBMI(height, weight) {
            const heightM = height / 100;
            return weight / (heightM * heightM);
        }

        function judge(bmi) {
            if (bmi < 18.5) {
                return "痩せ型";
            } else if (bmi < 25) {
                return "普通";
            } else {
                return "肥満";
            }
        }

        const button = document.querySelector("#button");
        const result = document.querySelector("#result");

        button.addEventListener("click", () => {
            console.log("押された");
            const height = Number(document.querySelector("#height").value);
            console.log(height);
            const weight = Number(document.querySelector("#weight").value);
            console.log(weight);
            if (height <= 0 || weight <= 0) {
                console.log("不適な数字");
                result.textContent = "身長と体重を正しく入力してください";
                return;
            }
            const bmi = calcBMI(height, weight);
            console.log(bmi);
            const judgment = judge(bmi);
            console.log(judgment);
            result.textContent = "BMI:" + bmi.toFixed(1) + "(" + judgment + ")";
        });
    </script>
</body>
</html>
